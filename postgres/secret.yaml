# postgres/secret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: doongle
type: Opaque
stringData:                          # 평문 작성 → k8s가 자동 인코딩
  POSTGRES_USER: doongle
  POSTGRES_PASSWORD: test1234
  POSTGRES_DB: doongledb
  # api·워커가 그대로 쓸 완성형 접속 URL (async 드라이버 스킴)
  DATABASE_URL: postgresql+asyncpg://doongle:test1234@postgres.doongle.svc.cluster.local:5432/doongledb
