# worker/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-worker
  namespace: doongle
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ai-worker
  template:
    metadata:
      labels:
        app: ai-worker
    spec:
      runtimeClassName: nvidia                      # GPU 런타임
      containers:
      - name: worker
        image: ghcr.io/lucid9512/doongle-ai:latest
        imagePullPolicy: Always
        envFrom:                                    # 하드코딩 env 제거 → ConfigMap/Secret 주입
        - configMapRef:
            name: doongle-config                    # KAFKA_BROKER/TOPIC/GROUP_ID, MODEL, MINIO_* 등
        - secretRef:
            name: postgres-credentials              # DATABASE_URL
        - secretRef:
            name: minio-client                      # MINIO_ACCESS_KEY / SECRET_KEY
        resources:
          requests:
            cpu: 100m              # HPA가 CPU % 계산하는 기준 (추가)
          limits:
            nvidia.com/gpu: 1                       # GPU 1개 요청 → 윈1 자동 배치
