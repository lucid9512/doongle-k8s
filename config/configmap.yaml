apiVersion: v1
kind: ConfigMap
metadata:
  name: doongle-config
  namespace: doongle
data:
  # --- Kafka (api·워커 공통) ---
  KAFKA_BROKER: "kafka-0.kafka.kafka.svc.cluster.local:9092"
  KAFKA_TOPIC: "image-jobs"
  KAFKA_GROUP_ID: "doongle-ai-workers"
  # --- 추론 모델 (워커) ---
  MODEL: "google/vit-base-patch16-224"
  # --- Storage (api·워커 공통) ---
  STORAGE_BACKEND: "minio"
  MINIO_ENDPOINT: "minio.doongle.svc.cluster.local:9000"
  MINIO_BUCKET: "doongle-images"
  MINIO_SECURE: "false"
  # --- App (api) ---
  PROJECT_NAME: "doongle-api"
  ENV: "production"
  DEBUG: "false"
  TESTING: "false"
  # --- JWT (api) — 비밀값(JWT_SECRET)은 Secret 으로 별도 주입 ---
  JWT_TOKEN_URL: "/api/v1/auth/login"
  JWT_ALGORITHM: "HS256"
  ACCESS_TOKEN_EXPIRE_MINUTES: "30"
  REFRESH_TOKEN_EXPIRE_DAYS: "7"
  # --- Logging (api) ---
  LOG_DIR: "logs"
  LOG_LEVEL: "INFO"
